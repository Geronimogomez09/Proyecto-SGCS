<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Comparador interactivo de herramientas de calidad de software.">
        <!-- Bootstrap proporciona estilos base, componentes y sistema de grilla responsive. -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <!-- Bootstrap Icons contiene los iconos utilizados en las distintas secciones. -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- Carga la tipografía Quicksand utilizada como fuente principal. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
            rel="stylesheet">
        <!-- Hojas de estilo propias para el header y el contenido de calidad de software. -->
        <link rel="stylesheet" href="css/style-header.css">
        <!-- Bootstrap JS permite utilizar tabs y otros componentes interactivos. -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            defer></script>
        <title>Comparador interactivo - Proyecto-SGCS</title>
    </head>
    <body>
        <!-- Contenedor donde se carga el encabezado compartido del sitio. -->
        <header id="header-container"></header>
        <!-- Hero principal con introducción y accesos rápidos a las primeras secciones. -->
        <section class="hero" aria-labelledby="hero-title">
            <!-- Wave superior utilizada como separación visual entre el header y el hero. -->
            <svg class="wave" viewBox="0 0 1440 200" preserveAspectRatio="none"
                aria-hidden="true">
                <path fill="#bfd8f5"
                    d="M0,10 C 240,25 480,20 720,10 C 960,0 1200,25 1440,20 L1440,0 L0,0 Z"></path>
            </svg>
            
        </section>
        <main>
            
        </main>
        <!-- JavaScript propio para cargar componentes  -->
        <script src="main.js" defer></script>
    </body>
</html>
