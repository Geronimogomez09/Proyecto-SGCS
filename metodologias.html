<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Define la codificación para que se muestren correctamente las tildes, la ñ y otros caracteres. -->
    <meta charset="UTF-8">
    <!-- Hace que la página se adapte al ancho de la pantalla del dispositivo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Carga Bootstrap 5.3.3 para utilizar su sistema de columnas, botones, acordeones y otros componentes. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Carga Bootstrap Icons, que proporciona los iconos utilizados en la página. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Permite establecer una conexión anticipada con Google Fonts para cargar la tipografía. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Importa la fuente Quicksand en distintos grosores para utilizarla en el diseño. -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Carga los estilos propios de la página y del encabezado compartido. -->
    <link rel="stylesheet" href="css/style-header.css">
    <!-- Carga los estilos específicos de las metodologías ágiles. -->
    <link rel="stylesheet" href="css/style-metodologias.css">
    <!-- Texto que aparece en la pestaña del navegador. -->
    <title>Metodologías Ágiles - Proyecto-SGCS</title>
</head>

<body>
    <!-- Contenedor vacío donde main.js puede insertar el encabezado compartido del sitio. -->
    <div id="header-container"></div>

    <!-- Presentación principal de la página: título, descripción, accesos rápidos e imagen. -->
    <div class="hero-agiles">
        <div class="hero-agiles-text">
            <div class="hero-agiles-copy">
                <h1 class="hero-agiles-title">Metodologías <span>Ágiles</span></h1>

                <p class="hero-agiles-description">
                    Son formas de organizar el desarrollo de software que buscan entregar valor
                    rápidamente, adaptarse a los cambios y mantener una comunicación constante
                    con el cliente y el equipo.
                </p>
            </div>

            <!-- Enlaces que llevan directamente a las secciones principales de la página. -->
            <nav class="hero-agiles-links" aria-label="Accesos rápidos">
                <a href="#scrum" class="hero-agiles-link">Scrum <i class="bi bi-arrow-right"></i></a>
                <a href="#kanban" class="hero-agiles-link">Kanban <i class="bi bi-arrow-right"></i></a>
                <a href="#xp" class="hero-agiles-link">XP <i class="bi bi-arrow-right"></i></a>
                <a href="#manifiesto" class="hero-agiles-link">Manifiesto A. <i class="bi bi-arrow-right"></i></a>
            </nav>
        </div>

        <!-- Zona visual de la presentación. La imagen se establece mediante CSS.
            aria-label describe su contenido para las tecnologías de asistencia. -->
        <div class="hero-agiles-img" role="img"
            aria-label="Equipo de trabajo reunido alrededor de una mesa con documentos y café"></div>
    </div>

    <!-- Contiene las secciones principales del contenido de la página. -->
    <main>

        <!-- Sección dedicada a Scrum. Su id permite acceder a ella desde los enlaces internos. -->
        <section class="metodologia metodologia-crema" id="scrum" data-toc-title="Scrum">
            <div class="container">
                <div class="metodologia-wrap">

                    <!-- Título de la metodología. -->
                    <div class="metodologia-title">
                        <h2>Metodología <span>Scrum</span></h2>
                    </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Carga el JavaScript general del sitio. defer hace que se ejecute después de analizar el HTML. -->
    <script src="main.js" defer></script>

    <!-- Carga Bootstrap JavaScript para habilitar acordeones, paneles laterales y demás componentes interactivos. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
