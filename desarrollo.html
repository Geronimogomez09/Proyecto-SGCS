<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Fundamentos, medición, estándares, técnicas y herramientas de calidad de software.">
        <!-- Bootstrap proporciona estilos base, componentes y sistema de grilla responsive. -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <!-- Bootstrap Icons contiene los iconos utilizados en las distintas secciones. -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- Carga la tipografía Quicksand utilizada como fuente principal. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
            rel="stylesheet">
        <!-- Hojas de estilo propias para el header y el contenido de calidad de software. -->
        <link rel="stylesheet" href="css/style-header.css">
        <link rel="stylesheet" href="css/.css">
        <!-- Bootstrap JS permite utilizar tabs y otros componentes interactivos. -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            defer></script>
        <title>Calidad de Software - Proyecto-SGCS</title>
    </head>
    <body>
        <!-- Contenedor donde se carga el encabezado compartido del sitio. -->
        <header id="header-container"></header>
        <!-- Hero principal con introducción y accesos rápidos a las primeras secciones. -->
        <section class="hero" aria-labelledby="hero-title">
            <div class="container hero-container">
                <!-- Texto principal que presenta el tema de calidad de software. -->
                <div class="hero-text">
                    <h1 id="hero-title" class="hero-title">
                        ¿Porque es importante el <span>desarrollo de software ?</span>
                    </h1>
                </div>
                <!-- Enlaces internos que permiten acceder rápidamente a las primeras secciones. -->
                <nav class="hero-links"
                    aria-label="Secciones de calidad de software">
                    <a href="#ciclo" class="hero-link">CICLO DE VIDA<i
                            class="bi bi-arrow-right"
                            aria-hidden="true"></i></a>
                    <a href="#modelos" class="hero-link2">MODELOS<i
                            class="bi bi-arrow-right"
                            aria-hidden="true"></i></a>
                    <a href="#resumen" class="hero-link">RESUMEN<i
                            class="bi bi-arrow-right"
                            aria-hidden="true"></i></a>
                </nav>
            </div>
        </section>

        <main>

        </main>
    </body>
        <!-- JavaScript propio para cargar componentes  -->
        <script src="main.js" defer></script>
    </body>
</html>
